<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" aria-labelledby="title desc" role="img" viewBox="0 0 1600 900"><title id="title">Speaker-aware meeting intelligence architecture</title><desc id="desc">A request-based audio pipeline that accepts meeting audio and optional speaker reference clips, sends the audio to the OpenAI Transcriptions API with gpt-4o-transcribe-diarize, stores diarized JSON, generates a speaker-labeled transcript, and sends it to a text model for structured meeting intelligence.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#20201d" d="M 0 0 L 10 5 L 0 10 z"/></marker><filter id="soft-shadow" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="10" flood-color="#111" flood-opacity=".1" stdDeviation="14"/></filter><style>.bg{fill:#f7f6f1}.lane,.panel{stroke:#d7d4ca}.panel{fill:#fff;stroke-width:1.5;rx:22;filter:url(#soft-shadow)}.lane{fill:#edebe3;stroke-width:1.2;rx:18}.title{font:700 28px Inter,Arial,sans-serif;fill:#111}.subtitle{font:400 17px Inter,Arial,sans-serif;fill:#55524a}.label{font:700 19px Inter,Arial,sans-serif;fill:#111}.small{font:400 15px Inter,Arial,sans-serif;fill:#5c594f}.tiny{font:400 13px Inter,Arial,sans-serif;fill:#6f6b61}.mono{font:600 14px &quot;SFMono-Regular&quot;,Consolas,monospace;fill:#111}.icon,.line{stroke:#20201d;fill:none}.line{stroke-width:2.2;marker-end:url(#arrow)}.icon{stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.icon-fill{fill:#f1faf6;stroke:#10a37f;stroke-width:1.8}</style></defs><rect width="1600" height="900" class="bg"/><text x="92" y="82" class="title">Speaker-Aware Meeting Intelligence Pipeline</text><text x="92" y="116" class="subtitle">Request-based diarization, structured extraction, and customer-ready outputs from meeting audio</text><rect width="1444" height="682" x="78" y="154" class="lane"/><text x="104" y="186" class="tiny">Core data path</text><rect width="220" height="300" x="112" y="220" class="panel"/><circle cx="222" cy="290" r="40" class="icon-fill"/><path d="M196 292 c8 -25 16 -25 24 0 c8 25 16 25 24 0" class="icon"/><path d="M187 310 h70" class="icon"/><text x="222" y="366" class="label" text-anchor="middle">Meeting audio</text><text x="222" y="396" class="small" text-anchor="middle">Recorded call,</text><text x="222" y="418" class="small" text-anchor="middle">webinar, or support</text><text x="222" y="440" class="small" text-anchor="middle">conversation</text><rect width="160" height="34" x="142" y="462" fill="#f7f6f1" stroke="#d7d4ca" rx="17"/><text x="222" y="484" class="mono" text-anchor="middle">meeting.wav</text><rect width="240" height="300" x="430" y="220" class="panel"/><circle cx="550" cy="290" r="40" class="icon-fill"/><path d="M530 278 h40 v26 h-40 z" class="icon"/><path d="M538 270 h24" class="icon"/><path d="M538 313 h24" class="icon"/><text x="550" y="366" class="label" text-anchor="middle">Pipeline runner</text><text x="550" y="396" class="small" text-anchor="middle">Validates audio,</text><text x="550" y="418" class="small" text-anchor="middle">encodes optional refs,</text><text x="550" y="440" class="small" text-anchor="middle">writes artifacts</text><rect width="168" height="34" x="466" y="462" fill="#f7f6f1" stroke="#d7d4ca" rx="17"/><text x="550" y="484" class="mono" text-anchor="middle">Python CLI</text><rect width="270" height="300" x="768" y="220" class="panel"/><circle cx="903" cy="290" r="40" class="icon-fill"/><path d="M886 290 a17 17 0 1 1 34 0 a17 17 0 1 1 -34 0" class="icon"/><path d="M872 290 h12 m38 0 h12" class="icon"/><path d="M903 273 v-14 m0 48 v14" class="icon"/><text x="903" y="356" class="label" text-anchor="middle">OpenAI Transcriptions API</text><text x="903" y="388" class="small" text-anchor="middle">Speaker diarization with</text><text x="903" y="416" class="mono" text-anchor="middle">gpt-4o-transcribe-diarize</text><rect width="192" height="34" x="807" y="462" fill="#f7f6f1" stroke="#d7d4ca" rx="17"/><text x="903" y="484" class="mono" text-anchor="middle">diarized_json</text><rect width="270" height="300" x="1138" y="220" class="panel"/><circle cx="1273" cy="290" r="40" class="icon-fill"/><path d="M1252 266 h34 l12 12 v36 h-46 z" class="icon"/><path d="M1286 266 v13 h12" class="icon"/><path d="M1262 292 h24 m-24 14 h42" class="icon"/><text x="1273" y="356" class="label" text-anchor="middle">Speaker transcript</text><text x="1273" y="388" class="small" text-anchor="middle">Segments with speaker,</text><text x="1273" y="410" class="small" text-anchor="middle">start time, end time,</text><text x="1273" y="432" class="small" text-anchor="middle">and utterance text</text><rect width="188" height="34" x="1179" y="462" fill="#f7f6f1" stroke="#d7d4ca" rx="17"/><text x="1273" y="484" class="mono" text-anchor="middle">segments.json</text><rect width="270" height="220" x="768" y="590" class="panel"/><circle cx="903" cy="652" r="34" class="icon-fill"/><path d="M886 650 h34 m-27 -13 h20 m-20 26 h20" class="icon"/><text x="903" y="716" class="label" text-anchor="middle">Structured intelligence</text><text x="903" y="746" class="small" text-anchor="middle">Summary, actions,</text><text x="903" y="768" class="small" text-anchor="middle">risks, decisions,</text><text x="903" y="790" class="small" text-anchor="middle">follow-up draft</text><rect width="270" height="220" x="1138" y="590" class="panel"/><circle cx="1273" cy="652" r="34" class="icon-fill"/><path d="M1253 637 h40 v34 h-40 z" class="icon"/><path d="M1262 648 h22 m-22 10 h28" class="icon"/><text x="1273" y="716" class="label" text-anchor="middle">Customer-ready outputs</text><text x="1273" y="746" class="small" text-anchor="middle">Meeting brief, CRM notes,</text><text x="1273" y="768" class="small" text-anchor="middle">support handoff, analytics,</text><text x="1273" y="790" class="small" text-anchor="middle">and review queues</text><rect width="558" height="92" x="112" y="718" class="lane"/><path d="M151 764 l15 15 l34 -39" class="icon"/><text x="220" y="754" class="label">Guardrails and review gate</text><text x="220" y="780" class="small">Redact PII, validate evidence, and optionally moderate text.</text><text x="220" y="802" class="small">Require human approval before CRM or support writes.</text><path d="M332 370 C372 370 390 370 430 370" class="line"/><path d="M670 370 C710 370 728 370 768 370" class="line"/><path d="M1038 370 C1080 370 1096 370 1138 370" class="line"/><path d="M1273 520 C1273 560 1078 560 1005 612" class="line"/><path d="M1038 700 C1080 700 1096 700 1138 700" class="line"/><path d="M670 764 C704 764 724 754 768 728" class="line"/><rect width="82" height="40" x="682" y="310" fill="#fff" stroke="#d7d4ca" stroke-width="1.5" rx="20"/><text x="723" y="335" class="mono" text-anchor="middle">POST API</text></svg>